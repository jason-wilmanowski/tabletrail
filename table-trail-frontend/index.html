<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabletrail-frontend</title>
    <!-- The five `design.monoFont` choices (regular weight only — font-mono
         is never combined with font-medium/font-semibold anywhere in the
         app). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=IBM+Plex+Mono:wght@400&family=JetBrains+Mono:wght@400&family=Roboto+Mono:wght@400&family=Source+Code+Pro:wght@400&display=swap"
      rel="stylesheet"
    />
    <!-- Applies the saved theme, accent color and monospace font before first
         paint, so users don't see a flash of the defaults while React loads.
         Mirrors `useApplyTheme`; 'dark', 'slate' and 'jetbrains-mono' must
         match the registry defaults. -->
    <script>
      try {
        const values = JSON.parse(localStorage.getItem('tabletrail-settings') || '{}').state?.values ?? {}
        const preference = values['design.theme'] ?? 'dark'
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = preference === 'system' ? (prefersLight ? 'light' : 'dark') : preference
        document.documentElement.dataset.accent = values['design.accentColor'] ?? 'slate'
        document.documentElement.dataset.monoFont = values['design.monoFont'] ?? 'jetbrains-mono'
      } catch {
        // Unreadable storage: keep the dark base theme from index.css.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
